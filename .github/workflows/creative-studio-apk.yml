name: Creative Studio Pro APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "creativeapp/**"
      - ".github/workflows/creative-studio-apk.yml"
      - "settings.gradle.kts"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Creative Studio APK
        run: gradle :creativeapp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Creative-Studio-Pro-APK
          path: creativeapp/build/outputs/apk/debug/creativeapp-debug.apk
          if-no-files-found: error
