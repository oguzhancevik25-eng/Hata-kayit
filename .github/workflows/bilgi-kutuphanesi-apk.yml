name: Bilgi Kutuphanesi APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "libraryapp/**"
      - ".github/workflows/bilgi-kutuphanesi-apk.yml"
      - "settings.gradle.kts"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Bilgi Kutuphanesi APK
        run: gradle :libraryapp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Bilgi-Kutuphanesi-APK
          path: libraryapp/build/outputs/apk/debug/libraryapp-debug.apk
          if-no-files-found: error
