name: QCC Pro Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "qccapp/**"
      - ".github/workflows/qcc-android-apk.yml"
      - "settings.gradle.kts"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build QCC Pro debug APK
        run: gradle :qccapp:assembleDebug --no-daemon

      - name: Upload QCC Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: QCC-Pro-APK
          path: qccapp/build/outputs/apk/debug/qccapp-debug.apk
          if-no-files-found: error
