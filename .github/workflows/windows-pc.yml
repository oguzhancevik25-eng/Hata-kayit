name: Windows PC Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-pc.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build portable EXE
        run: npm run dist
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Operator-Takip-PC-Windows
          path: desktop/dist/*.exe
          retention-days: 90
