name: Before After APK Build

on:
  push:
    branches: [main]
    paths:
      - 'beforeafter/**'
      - 'settings.gradle.kts'
      - '.github/workflows/before-after-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle :beforeafter:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oncesi-Sonrasi-APK
          path: beforeafter/build/outputs/apk/debug/beforeafter-debug.apk
          retention-days: 90
