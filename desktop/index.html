<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Operatör Takip PC</title>
<style>
:root{--blue:#0b4f7d;--blue2:#0e7490;--green:#15803d;--red:#b91c1c;--bg:#f5f7fa;--card:#fff;--text:#18212f;--muted:#687386;--line:#dfe5ec;--shadow:0 10px 28px rgba(20,38,60,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0a3c61;color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:800;margin:0 0 4px}.version{opacity:.72;font-size:12px;margin-bottom:28px}.nav button{width:100%;border:0;background:transparent;color:#dbeafe;text-align:left;padding:12px 13px;border-radius:10px;margin:3px 0;cursor:pointer;font-weight:600}.nav button:hover,.nav button.active{background:#fff;color:#0a3c61}.main{padding:24px 30px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.title{font-size:28px;font-weight:800}.sub{color:var(--muted);font-size:13px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(120px,1fr))}.card{background:var(--card);border:1px solid #e7ebf0;border-radius:15px;box-shadow:var(--shadow);padding:16px}.kpi .n{font-size:29px;font-weight:800}.kpi .l{font-size:12px;color:var(--muted)}.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,1fr)}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #cfd8e3;border-radius:9px;background:#fff}.field textarea{min-height:86px;resize:vertical}.span2{grid-column:span 2}.span4{grid-column:span 4}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:800}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.soft{background:#eaf2f9;color:#0a3c61}.ghost{background:#fff;border:1px solid #ccd6e1;color:#334155}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.sectionTitle{font-size:18px;font-weight:800;margin:2px 0 12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #e7ebf0;text-align:left;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;color:#64748b;background:#f8fafc}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800}.p-red{background:#fee2e2;color:#991b1b}.p-green{background:#dcfce7;color:#166534}.p-blue{background:#dbeafe;color:#1d4ed8}.p-yellow{background:#fef3c7;color:#92400e}.record{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid #e4e9ef;border-radius:12px;padding:12px;margin:9px 0;background:#fff}.record h4{margin:0 0 5px}.record small{color:var(--muted)}.record img,.thumb{width:150px;height:100px;object-fit:cover;border-radius:10px;border:1px solid #dbe2ea}.photoLine{display:flex;gap:12px;align-items:center}.hint{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:10px 12px;border-radius:10px;font-size:12px}.success{background:#ecfdf5;border:1px solid #bbf7d0;color:#166534;padding:10px 12px;border-radius:10px}.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:10px}.hidden{display:none!important}.score{font-size:42px;font-weight:900;color:var(--blue)}.grade{font-size:42px;font-weight:900}.bar{height:9px;background:#e9eef3;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.modal{position:fixed;inset:0;background:rgba(8,15,25,.48);display:flex;align-items:center;justify-content:center;padding:30px;z-index:10}.modalBox{width:min(900px,95vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}.span4{grid-column:span 2}.app{grid-template-columns:210px 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">Operatör Takip</div><div class="version">Windows PC • v1.5</div><div class="nav" id="nav"></div></aside>
<main class="main"><div id="page"></div></main>
</div>
<input type="file" id="importFile" accept="application/json" class="hidden" />
<script>
const defaults={operators:[['6095','NUSRET BULUT'],['614','LEVENT DOĞUER'],['6112','AHMET SEZER'],['3388','İLYAS ÖZDEMİR'],['2921','GİRAY ÇALIŞIR'],['4975','SEZGİN NALBATÇI'],['5828','EREN YİĞİTOĞLU'],['686','RUHAN SEVİL TEKEOĞLU'],['596','FATİH HENDEKÇİ'],['2484','MESUT MÜHÜRDAROÇ']].map(x=>({sicil:x[0],name:x[1],active:true})),parts:[
['130D FR Upper Resin RH','1700T'],['130D FR Upper TPO RH','1600T-1'],['130D FR Lower RH - DELİKSİZ','1600T-2'],['130D FR Lower RH - DELİKLİ','1600T-2'],['130D FR Lower LH - DELİKSİZ','1600T-2'],['130D FR Lower LH - DELİKLİ','1600T-2'],['130D FR OMT RH','850T'],['130D FR Pocket RH','1600T-1'],['130D RR Upper Base RH','1700T'],['130D RR Lower RH','1600T-3'],['130D RR Lower LH','1700T'],['130D IP LH','850T'],['130D IP RH','850T'],['OUTER SHLD. M6 RHD - SPRT. YOK (EN59)','650T'],['OUTER SHLD. M6 RHD - SPRT. VAR (EN65)','650T'],["OUTER SHLD. M4 A/B'li LHD- SPRT. YOK (EN61)",'650T'],["OUTER SHLD. M4 A/B'li LHD- SPRT. VAR (EN62)",'650T'],['3ZR CAP','650T'],['FR RH LowerCover','1700T'],['FR LH Lower Cover','1600T-3'],['FR UB RH TPO-DERİ KAPLAMA','1600T-1'],['FR UB RH Lambasız-SİYAH','1600T-2'],['FR UB RH Lambasız-Krem','1600T-1'],['FR UB RH Lambasız-GRİ','1600T-1'],['FR UB RH Lambalı-SİYAH','1600T-3'],['RR UB RH TPO-DERİ KAPLAMA','1600T-1'],['RR UB RH Lambalı-Siyah','1600T-1'],['RR UB RH Lambasız-Siyah','1600T-3'],['RR UB RH Lambasız-Krem','1600T-3'],['RR UB RH Lambasız-GRİ','1600T-3'],['IP LHD','1600T-1'],['IP RHD','1600T-1'],['2.0 HV CAP','650T'],['025D ZR-HV CAP','650T'],['025D IP HARD SİYAH','850T'],['025D IP HARD GREY','850T'],['369 IP 9İNÇ KÜÇÜK RH','850T'],['369 IP 9İNÇ BÜYÜK RH','850T'],['369 IP 10İNÇ KÜÇÜK RH','850T'],['369 IP 10İNÇ BÜYÜK RH','850T'],['BACK BOARD BÜYÜK','850T']].map(x=>({name:x[0],machine:x[1]})),defects:{'Şişme':1.5,'Felt Eksik':1.5,'Çapak':1,'Yolluk Kalma':3,'Yolluk Yapışması':1,'Çökme':1,'Eksik':2,'İz':1,'Yabancı Madde':1,'Hatalı Setleme':1,'Kabarma':1,'Beyazlık':.3,'Leke':.1,'Deforme':.2,'Diğer':1},machines:['1600T-1','1600T-2','1600T-3','1700T','850T','650T'],types:['Kaçan Hata','Yakalanan Hata','KY','Kaizen','Mesai','Yıllık İzin','Günlük İzin','Rapor','Devamsızlık']};
const K='operatorTakipPC_v1';
const defaultScoring={qualityMax:40,kyMax:15,kaizenMax:15,attendanceMax:20,overtimeMax:10,qualityStart:35,escapedPenalty:4,caughtBonus:.5,caughtBonusCap:5,kyMonthlyTarget:6,kaizenMonthlyTarget:1,overtimeMonthlyTarget:10,absencePenaltyPerDay:5,gradeA:90,gradeB:80,gradeC:70};
function normalizeDb(x){
  x=x&&typeof x==='object'?x:{};
  if(!Array.isArray(x.operators)||!x.operators.length)x.operators=JSON.parse(JSON.stringify(defaults.operators));
  if(!Array.isArray(x.records))x.records=[];
  if(!x.refs||typeof x.refs!=='object')x.refs={};
  if(!Array.isArray(x.parts)||!x.parts.length)x.parts=JSON.parse(JSON.stringify(defaults.parts));
  if(!Array.isArray(x.machines)||!x.machines.length)x.machines=[...defaults.machines];
  x.scoring=Object.assign({},defaultScoring,x.scoring||{});
  return x;
}
let db=load();let current='dashboard';let editId=null;
function load(){try{const x=JSON.parse(localStorage.getItem(K));if(x)return normalizeDb(x)}catch(e){}return normalizeDb({operators:defaults.operators,records:[],refs:{},parts:defaults.parts,machines:defaults.machines,scoring:defaultScoring})}
function save(){localStorage.setItem(K,JSON.stringify(db))}
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:1});
const date=t=>new Date(t).toLocaleString('tr-TR');
const unit=t=>t==='Mesai'?'saat':(['Yıllık İzin','Günlük İzin','Rapor','Devamsızlık'].includes(t)?'gün':'adet');
const activeOps=()=>db.operators.filter(o=>o.active);
const opBy=s=>db.operators.find(o=>o.sicil===s);
function months(){let s=new Date(2026,7,1),e=new Date(2027,6,31),n=new Date();if(n<s)n=s;if(n>e)n=e;return Math.max(1,Math.min(12,(n.getFullYear()-s.getFullYear())*12+n.getMonth()-s.getMonth()+1))}
function inPeriodRecord(r){let d=new Date(r.timestamp),s=new Date(2026,7,1),e=new Date(2027,7,1);return d>=s&&d<e}
function scoreRows(rows,targetMonths){
  let sc=db.scoring||defaultScoring;
  let sum=t=>rows.filter(r=>r.type===t).reduce((a,r)=>a+Number(r.amount||0),0);
  let wt=t=>rows.filter(r=>r.type===t).reduce((a,r)=>a+Number(r.amount||0)*(defaults.defects[r.defect]||1),0);
  let m=Math.max(1,targetMonths||1);
  let qStart=Math.max(0,Math.min(Number(sc.qualityMax),Number(sc.qualityStart)));
  let q=Math.max(0,Math.min(Number(sc.qualityMax),qStart+Math.min(wt('Yakalanan Hata')*Number(sc.caughtBonus),Number(sc.caughtBonusCap))-wt('Kaçan Hata')*Number(sc.escapedPenalty)));
  let ky=Math.min(Number(sc.kyMax),sum('KY')/(m*Math.max(.0001,Number(sc.kyMonthlyTarget)))*Number(sc.kyMax));
  let k=Math.min(Number(sc.kaizenMax),sum('Kaizen')/(m*Math.max(.0001,Number(sc.kaizenMonthlyTarget)))*Number(sc.kaizenMax));
  let dev=Math.max(0,Number(sc.attendanceMax)-sum('Devamsızlık')*Number(sc.absencePenaltyPerDay));
  let mes=Math.min(Number(sc.overtimeMax),sum('Mesai')/(m*Math.max(.0001,Number(sc.overtimeMonthlyTarget)))*Number(sc.overtimeMax));
  let raw=q+ky+k+dev+mes,maxTotal=Number(sc.qualityMax)+Number(sc.kyMax)+Number(sc.kaizenMax)+Number(sc.attendanceMax)+Number(sc.overtimeMax);
  let total=maxTotal>0?Math.max(0,Math.min(100,raw/maxTotal*100)):0;
  let grade=rows.length?(total>=Number(sc.gradeA)?'A':total>=Number(sc.gradeB)?'B':total>=Number(sc.gradeC)?'C':'D'):'—';
  return{rows:rows.length,escaped:sum('Kaçan Hata'),caught:sum('Yakalanan Hata'),KY:sum('KY'),kaizen:sum('Kaizen'),mesai:sum('Mesai'),annualLeave:sum('Yıllık İzin'),dailyLeave:sum('Günlük İzin'),izin:sum('Yıllık İzin')+sum('Günlük İzin'),rapor:sum('Rapor'),devam:sum('Devamsızlık'),q,ky,k,dev,mes,total:rows.length?total:0,grade};
}
function summary(op){return scoreRows(db.records.filter(r=>r.operatorSicil===op.sicil&&inPeriodRecord(r)),months())}
const nav=[['dashboard','Ana Panel'],['entry','Kayıt Girişi'],['defects','Hata Kütüphanesi'],['people','Personel'],['monthly','Aylık Analiz'],['management','Yönetim'],['scoring','Puanlama'],['backup','Yedek / Aktarım']];
function renderNav(){document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${current===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){current=p;editId=null;render()}
function render(){renderNav();({dashboard,entry,defects,people,monthly,management,scoring,backup}[current]||dashboard)()}
function dashboard(){let ops=activeOps(),ss=ops.map(summary),scores=ss.filter(x=>x.rows).map(x=>x.total),avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;let escaped=ss.reduce((a,x)=>a+x.escaped,0),caught=ss.reduce((a,x)=>a+x.caught,0),ky=ss.reduce((a,x)=>a+x.KY,0),ka=ss.reduce((a,x)=>a+x.kaizen,0);page.innerHTML=`<div class="top"><div><div class="title">Yönetici Dashboard</div><div class="sub">01.08.2026 – 31.07.2027 • Aktif hedef ayı: ${months()}</div></div><button class="btn primary" onclick="go('entry')">+ Yeni Kayıt</button></div><div class="grid kpis"><div class="card kpi"><div class="n">${fmt(avg)}</div><div class="l">Takım Ortalama Puan</div></div><div class="card kpi"><div class="n">${fmt(escaped)}</div><div class="l">Kaçan Hata</div></div><div class="card kpi"><div class="n">${fmt(caught)}</div><div class="l">Yakalanan Hata</div></div><div class="card kpi"><div class="n">${fmt(ky)}</div><div class="l">KY</div></div><div class="card kpi"><div class="n">${fmt(ka)}</div><div class="l">Kaizen</div></div><div class="card kpi"><div class="n">${ops.length}</div><div class="l">Aktif Operatör</div></div></div><div class="card" style="margin-top:16px"><div class="sectionTitle">Operatör Performansları</div><div class="tablewrap"><table class="table"><thead><tr><th>Sicil</th><th>Personel</th><th>Puan</th><th>Sınıf</th><th>KY</th><th>Kaizen</th><th>Kaçan</th><th>Yakalanan</th><th>Mesai</th></tr></thead><tbody>${ops.map(o=>{let s=summary(o);return`<tr><td>${esc(o.sicil)}</td><td>${esc(o.name)}</td><td><b>${s.rows?fmt(s.total):'—'}</b></td><td><span class="pill ${s.grade==='A'?'p-green':s.grade==='B'?'p-blue':s.grade==='C'?'p-yellow':'p-red'}">${s.grade}</span></td><td>${fmt(s.KY)}</td><td>${fmt(s.kaizen)}</td><td>${fmt(s.escaped)}</td><td>${fmt(s.caught)}</td><td>${fmt(s.mesai)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function entry(){let ops=activeOps();if(!ops.length){page.innerHTML='<div class="card warn">Önce Ekip Yönetimi bölümünden aktif operatör ekleyin.</div>';return}let r=editId?db.records.find(x=>x.id===editId):null;let selectedPart=r?.part||'',machine=r?.machine||(db.machines[0]||'');page.innerHTML=`<div class="top"><div><div class="title">${r?'Kaydı Düzenle':'Günlük Kayıt Girişi'}</div><div class="sub">Parçayı seçtiğinde makine otomatik gelir.</div></div>${r?'<button class="btn ghost" onclick="editId=null;entry()">Düzenlemeyi İptal</button>':''}</div><div class="card"><div class="formgrid"><div class="field"><label>Operatör</label><select id="op">${ops.map(o=>`<option value="${esc(o.sicil)}" ${r?.operatorSicil===o.sicil?'selected':''}>${esc(o.sicil+' - '+o.name)}</option>`).join('')}</select></div><div class="field"><label>Kayıt Türü</label><select id="type" onchange="toggleDefect()">${defaults.types.map(x=>`<option ${r?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" id="defectField"><label>Hata Türü</label><select id="defect">${Object.keys(defaults.defects).map(x=>`<option ${r?.defect===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Miktar / Saat / Gün</label><input id="amount" type="number" min="0" step="0.1" value="${r?.amount??1}"></div><div class="field span2"><label>Parça / Kalıp</label><select id="part" onchange="partChanged()"><option value="">— Parça seç —</option>${db.parts.map(p=>`<option value="${esc(p.name)}" ${selectedPart===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Makine</label><select id="machine">${db.machines.map(x=>`<option ${machine===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Fotoğraf</label><input id="photo" type="file" accept="image/*"></div><div class="field span4"><label>Açıklama / Detay</label><textarea id="note">${esc(r?.note||'')}</textarea></div><div class="span4 toolbar"><button class="btn primary" onclick="saveRecord()">${r?'KAYDI GÜNCELLE':'KAYDI KAYDET'}</button></div></div></div><div class="card" style="margin-top:16px"><div class="sectionTitle">Son Kayıtlar</div>${db.records.slice(-12).reverse().map(recordCard).join('')||'<div class="sub">Henüz kayıt yok.</div>'}</div>`;toggleDefect()}
function toggleDefect(){let t=document.getElementById('type');let f=document.getElementById('defectField');if(t&&f)f.classList.toggle('hidden',!['Kaçan Hata','Yakalanan Hata'].includes(t.value))}
function partChanged(){let p=db.parts.find(x=>x.name===document.getElementById('part').value);if(p)document.getElementById('machine').value=p.machine}
async function file64(el){let f=el.files[0];if(!f)return'';return await new Promise(res=>{let rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(f)})}
async function saveRecord(){let amount=Number(document.getElementById('amount').value);if(!(amount>0)){alert('Miktar 0 dan büyük olmalı');return}let old=editId?db.records.find(x=>x.id===editId):null;let photo=await file64(document.getElementById('photo'))||old?.photo||'';let type=document.getElementById('type').value,obj={id:old?.id||Date.now(),timestamp:old?.timestamp||Date.now(),operatorSicil:document.getElementById('op').value,type,defect:['Kaçan Hata','Yakalanan Hata'].includes(type)?document.getElementById('defect').value:'',amount,machine:document.getElementById('machine').value,part:document.getElementById('part').value,note:document.getElementById('note').value.trim(),photo};if(old)db.records[db.records.findIndex(x=>x.id===old.id)]=obj;else db.records.push(obj);save();editId=null;entry()}
function recordCard(r){let o=opBy(r.operatorSicil),cl=r.type==='Kaçan Hata'?'p-red':r.type==='Yakalanan Hata'?'p-green':r.type==='KY'?'p-blue':r.type==='Kaizen'?'p-yellow':'';return`<div class="record"><div><h4>${esc(o?.name||r.operatorSicil)} • <span class="pill ${cl}">${esc(r.type)}</span></h4><small>Sicil ${esc(r.operatorSicil)} • ${date(r.timestamp)}</small><div style="margin-top:7px"><b>${fmt(r.amount)} ${unit(r.type)}</b>${r.defect?' • '+esc(r.defect)+' ×'+(defaults.defects[r.defect]||1):''}</div>${r.part?`<div>Parça: ${esc(r.part)}</div>`:''}${r.machine?`<div>Makine: ${esc(r.machine)}</div>`:''}${r.note?`<div>Açıklama: ${esc(r.note)}</div>`:''}${r.photo?`<div style="margin-top:8px"><img src="${r.photo}"></div>`:''}</div><div class="toolbar"><button class="btn soft" onclick="editRecord(${r.id})">Düzenle</button><button class="btn danger" onclick="deleteRecord(${r.id})">Sil</button></div></div>`}
function editRecord(id){editId=id;current='entry';render()}function deleteRecord(id){if(confirm('Bu kayıt silinsin mi?')){db.records=db.records.filter(x=>x.id!==id);save();render()}}
function defects(){page.innerHTML=`<div class="top"><div><div class="title">Hata Fotoğraf Kütüphanesi</div><div class="sub">Operatöre örnek hata fotoğrafını göstermek için kullanılır.</div></div></div><div class="grid three">${Object.entries(defaults.defects).map(([d,w])=>`<div class="card"><div class="sectionTitle">${esc(d)} <span class="pill p-blue">×${w}</span></div>${db.refs[d]?`<img class="thumb" src="${db.refs[d]}">`:'<div class="warn">Fotoğraf eklenmedi</div>'}<div style="margin-top:10px"><input type="file" accept="image/*" onchange="setRef('${d.replace(/'/g,"\\'")}',this)"></div>${db.refs[d]?`<button class="btn danger" style="margin-top:8px" onclick="removeRef('${d.replace(/'/g,"\\'")}')">Fotoğrafı Sil</button>`:''}</div>`).join('')}</div>`}
async function setRef(d,el){let x=await file64(el);if(x){db.refs[d]=x;save();defects()}}function removeRef(d){delete db.refs[d];save();defects()}
function people(){let ops=activeOps();page.innerHTML=`<div class="top"><div><div class="title">Personel Performans Kartları</div><div class="sub">Yıllık performans görüşmesi için detaylı özet.</div></div></div><div class="grid two">${ops.map(o=>{let s=summary(o);return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="sectionTitle">${esc(o.name)}</div><div class="sub">Sicil ${esc(o.sicil)}</div></div><div style="text-align:right"><div class="score">${s.rows?fmt(s.total):'—'}</div><div class="grade">${s.grade}</div></div></div><div class="tablewrap"><table class="table"><tr><td>KY</td><td><b>${fmt(s.KY)}</b></td><td>Kaizen</td><td><b>${fmt(s.kaizen)}</b></td></tr><tr><td>Kaçan Hata</td><td><b>${fmt(s.escaped)}</b></td><td>Yakalanan Hata</td><td><b>${fmt(s.caught)}</b></td></tr><tr><td>Mesai</td><td><b>${fmt(s.mesai)} saat</b></td><td>İzin</td><td><b>${fmt(s.izin)} gün</b></td></tr><tr><td>Rapor</td><td><b>${fmt(s.rapor)} gün</b></td><td>Devamsızlık</td><td><b>${fmt(s.devam)} gün</b></td></tr></table></div><div class="sub" style="margin-top:10px">Kalite ${fmt(s.q)}/${fmt(db.scoring.qualityMax)} • KY ${fmt(s.ky)}/${fmt(db.scoring.kyMax)} • Kaizen ${fmt(s.k)}/${fmt(db.scoring.kaizenMax)} • Devam ${fmt(s.dev)}/${fmt(db.scoring.attendanceMax)} • Mesai ${fmt(s.mes)}/${fmt(db.scoring.overtimeMax)}</div></div>`}).join('')}</div>`}
function team(){page.innerHTML=`<div class="top"><div><div class="title">Ekip Yönetimi</div><div class="sub">Operatör ekle, pasife al veya geri aktifleştir.</div></div></div><div class="grid two"><div class="card"><div class="sectionTitle">Yeni Operatör</div><div class="formgrid"><div class="field span2"><label>Sicil No</label><input id="newSicil"></div><div class="field span2"><label>Ad Soyad</label><input id="newName"></div><div class="span4"><button class="btn green" onclick="addOp()">OPERATÖR EKLE</button></div></div></div><div class="card"><div class="sectionTitle">Durum</div><div class="sub">Aktif: ${db.operators.filter(x=>x.active).length} • Pasif: ${db.operators.filter(x=>!x.active).length}</div></div></div><div class="card" style="margin-top:16px"><div class="tablewrap"><table class="table"><thead><tr><th>Sicil</th><th>Ad Soyad</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${db.operators.map(o=>`<tr><td>${esc(o.sicil)}</td><td>${esc(o.name)}</td><td><span class="pill ${o.active?'p-green':'p-red'}">${o.active?'AKTİF':'PASİF'}</span></td><td><button class="btn ${o.active?'danger':'green'}" onclick="toggleOp('${esc(o.sicil)}')">${o.active?'ÇIKAR':'GERİ AL'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addOp(){let s=document.getElementById('newSicil').value.trim(),n=document.getElementById('newName').value.trim().toUpperCase();if(!s||!n){alert('Sicil ve ad soyad girin');return}if(db.operators.some(x=>x.sicil===s)){alert('Bu sicil zaten kayıtlı');return}db.operators.push({sicil:s,name:n,active:true});save();team()}function toggleOp(s){let o=db.operators.find(x=>x.sicil===s);o.active=!o.active;save();team()}
function backup(){page.innerHTML=`<div class="top"><div><div class="title">Yedek / Aktarım</div><div class="sub">Bilgisayardaki verileri JSON dosyasına yedekle ve geri yükle.</div></div></div><div class="grid two"><div class="card"><div class="sectionTitle">Yedek Al</div><p class="sub">Tüm operatörler, kayıtlar, fotoğraflar ve hata kütüphanesi tek dosyada kaydedilir.</p><button class="btn primary" onclick="exportData()">YEDEĞİ İNDİR</button></div><div class="card"><div class="sectionTitle">Yedekten Geri Yükle</div><p class="sub">Daha önce alınan JSON yedeğini seç.</p><button class="btn ghost" onclick="importFile.click()">DOSYA SEÇ</button></div></div><div class="card" style="margin-top:16px"><div class="sectionTitle">Telefon + PC</div><div class="hint">PC sürümü telefondaki v1.5 özelliklerini içerir ve bilgisayarda çevrimdışı çalışır. Telefon ile PC verileri şu an otomatik senkron değildir; JSON yedek/geri yükleme ile PC verisini taşıyabilirsin.</div></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='Operator-Takip-PC-Yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
importFile.onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.operators||!x.records)throw Error();if(confirm('Mevcut veriler yedek dosyasıyla değiştirilsin mi?')){db=normalizeDb(x);save();render()}}catch(err){alert('Geçersiz yedek dosyası')}};rd.readAsText(f)};
</script>
<script src="v15-extra.js"></script>
<script>
render();
</script>
</body>
</html>
